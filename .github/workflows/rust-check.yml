name: Schnelltest Rust-Code

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

on:
  workflow_dispatch: # Erlaubt das manuelle Starten per Button auf GitHub

jobs:
  check-rust:
    name: Rust Syntax Check (Windows)
    runs-on: windows-2022

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0 # Exakt die Version aus dem RustDesk-Hauptprojekt

      - name: Cache für Rust aktivieren
        uses: swatinem/rust-cache@v2

      - name: Cargo Check ausführen
        run: cargo check --manifest-path Cargo.toml
